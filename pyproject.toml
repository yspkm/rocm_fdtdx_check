[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fdtdx-accelerator-check"
version = "0.1.0"
description = "A small, vendor-neutral FDTDX accelerator capacity and science check."
requires-python = ">=3.11,<3.15"
license = { text = "GPL-3.0-only" }
dependencies = [
  "PyYAML>=6.0.2",
  "fdtdx @ git+https://github.com/ymahlau/fdtdx.git@77b4bc523a8e98cb7dd388e99481a0000f71dd4d",
]

[project.scripts]
fdtdx-check = "fdtdx_check.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fdtdx_check"]
