schema: 1
backend: rocm
purpose: capacity_profile

numerics:
  precision: float64
  enable_x64: true
  bytes_per_cell: 640       # conservative FP64 planning value, not a measurement

device_pool:
  policy: grow
  expected_physical_accelerators: 4
  memory_gib_per_physical_accelerator: 128
  aggregate_hbm_gib: 512
  min_devices: 1
  max_devices: all
  memory_gib_per_logical_device: auto
  usable_fraction: 0.80
  retry_on_oom: true

profile:
  device_counts: [1, 2, 4, all]
  steps: 4
  safe_fraction: 0.70
  cases:
    - {id: P00, local_shape: [32, 128, 64]}
    - {id: P01, local_shape: [64, 256, 128]}
    - {id: P02, local_shape: [96, 384, 192]}
    - {id: P03, local_shape: [128, 512, 256]}
    - {id: P04, local_shape: [160, 640, 320]}
    - {id: P05, local_shape: [192, 768, 384]}
    - {id: P06, local_shape: [224, 896, 448]}
    - {id: P07, local_shape: [256, 1024, 512]}
    - {id: P08, local_shape: [320, 1280, 640]}
